<svg viewBox="0 0 900 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title-b desc-b">
  <title id="title-b">旅程 B · 单项目"过程 → 资产"完整链路</title>
  <desc id="desc-b">从数据持续采集到首份文档生成、自评、用户判断与重生成回路</desc>

  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-b-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ca8a04"/>
    </marker>
  </defs>

  <style>
    .b-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .b-start { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
    .b-end { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .b-dia { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; }
    .b-lb { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #0f172a; }
    .b-ls { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 12px; fill: #475569; }
    .b-arr { stroke: #64748b; stroke-width: 1.6; fill: none; }
    .b-arr-loop { stroke: #ca8a04; stroke-width: 1.6; fill: none; stroke-dasharray: 5,3; }
    .b-title { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
  </style>

  <text x="450" y="30" text-anchor="middle" class="b-title">旅程 B · 单项目"过程 → 资产"完整链路</text>

  <rect x="330" y="60" width="240" height="56" rx="8" class="b-start"/>
  <text x="450" y="83" text-anchor="middle" class="b-lb">数据源持续采集</text>
  <text x="450" y="102" text-anchor="middle" class="b-ls">Claude Code / Cursor / VS Code / GitHub</text>

  <line x1="450" y1="116" x2="450" y2="150" class="b-arr" marker-end="url(#arrow-b)"/>

  <rect x="330" y="150" width="240" height="56" rx="8" class="b-box"/>
  <text x="450" y="173" text-anchor="middle" class="b-lb">工作台实时事件流</text>
  <text x="450" y="192" text-anchor="middle" class="b-ls">PR / Commit / 对话流入即可见</text>

  <line x1="450" y1="206" x2="450" y2="240" class="b-arr" marker-end="url(#arrow-b)"/>

  <rect x="330" y="240" width="240" height="56" rx="8" class="b-box"/>
  <text x="450" y="263" text-anchor="middle" class="b-lb">触发首份周报生成</text>
  <text x="450" y="282" text-anchor="middle" class="b-ls">累积 ≥20 事件 或 PR 合并</text>

  <line x1="450" y1="296" x2="450" y2="330" class="b-arr" marker-end="url(#arrow-b)"/>

  <rect x="330" y="330" width="240" height="56" rx="8" class="b-box"/>
  <text x="450" y="353" text-anchor="middle" class="b-lb">5 阶段进度可视化</text>
  <text x="450" y="372" text-anchor="middle" class="b-ls">采集→识别→抽取→撰写→校对</text>

  <line x1="450" y1="386" x2="450" y2="420" class="b-arr" marker-end="url(#arrow-b)"/>

  <rect x="330" y="420" width="240" height="56" rx="8" class="b-box"/>
  <text x="450" y="443" text-anchor="middle" class="b-lb">文档呈现 + 自评卡</text>
  <text x="450" y="462" text-anchor="middle" class="b-ls">套用品牌版式 · 覆盖度 / 引用 / 空话</text>

  <line x1="450" y1="476" x2="450" y2="500" class="b-arr" marker-end="url(#arrow-b)"/>

  <polygon points="450,500 580,560 450,620 320,560" class="b-dia"/>
  <text x="450" y="556" text-anchor="middle" class="b-lb">用户判断</text>
  <text x="450" y="574" text-anchor="middle" class="b-ls">满意 / 不满意 / 放弃</text>

  <line x1="450" y1="620" x2="450" y2="650" class="b-arr" marker-end="url(#arrow-b)"/>
  <text x="460" y="640" class="b-ls">满意</text>

  <rect x="330" y="650" width="240" height="56" rx="8" class="b-end"/>
  <text x="450" y="673" text-anchor="middle" class="b-lb">进入审核流</text>
  <text x="450" y="692" text-anchor="middle" class="b-ls">→ 旅程 C</text>

  <polyline points="580,560 780,560 780,448 570,448" class="b-arr-loop" marker-end="url(#arrow-b-loop)"/>
  <text x="790" y="508" class="b-ls" fill="#ca8a04">不满意</text>
  <text x="790" y="526" class="b-ls" fill="#ca8a04">章节重生成</text>
  <text x="790" y="544" class="b-ls" fill="#ca8a04">切换模型 / 调版式</text>
</svg>
