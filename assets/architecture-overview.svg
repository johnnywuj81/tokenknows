<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- TokenKnows architecture overview · sources → collectors → pipeline → assets
       Theme-neutral: mid-tone strokes/text readable on GitHub light & dark. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#d97757" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- column: sources -->
  <text x="100" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#d97757">SOURCES</text>
  <g font-size="12.5" fill="#888888">
    <rect x="20" y="48"  width="160" height="34" rx="8" fill="none" stroke="#88888866"/>
    <text x="100" y="69" text-anchor="middle">Claude Code</text>
    <rect x="20" y="90"  width="160" height="34" rx="8" fill="none" stroke="#88888866"/>
    <text x="100" y="111" text-anchor="middle">Codex</text>
    <rect x="20" y="132" width="160" height="34" rx="8" fill="none" stroke="#88888866"/>
    <text x="100" y="153" text-anchor="middle">Cursor</text>
    <rect x="20" y="174" width="160" height="34" rx="8" fill="none" stroke="#88888866"/>
    <text x="100" y="195" text-anchor="middle">VS Code</text>
    <rect x="20" y="216" width="160" height="34" rx="8" fill="none" stroke="#88888866"/>
    <text x="100" y="237" text-anchor="middle">GitHub PRs · commits</text>
    <rect x="20" y="258" width="160" height="34" rx="8" fill="none" stroke="#88888866"/>
    <text x="100" y="279" text-anchor="middle">Local docs</text>
  </g>

  <!-- collectors -->
  <line x1="184" y1="170" x2="236" y2="170" stroke="#d97757" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="240" y="120" width="150" height="100" rx="10" fill="#d9775714" stroke="#d97757"/>
  <text x="315" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#d97757">Collectors</text>
  <text x="315" y="178" text-anchor="middle" font-size="11.5" fill="#888888">file watchers · API polling</text>
  <text x="315" y="196" text-anchor="middle" font-size="11.5" fill="#888888">trust scoring · dedup</text>

  <!-- event store -->
  <line x1="394" y1="170" x2="446" y2="170" stroke="#d97757" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="450" y="128" width="130" height="84" rx="10" fill="none" stroke="#88888899"/>
  <text x="515" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#888888">Event store</text>
  <text x="515" y="182" text-anchor="middle" font-size="11.5" fill="#888888">SQLite · local</text>

  <!-- pipeline -->
  <line x1="584" y1="170" x2="636" y2="170" stroke="#d97757" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="640" y="96" width="170" height="148" rx="10" fill="#d9775714" stroke="#d97757"/>
  <text x="725" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#d97757">5-stage pipeline</text>
  <text x="725" y="146" text-anchor="middle" font-size="11.5" fill="#888888">collect → outline →</text>
  <text x="725" y="163" text-anchor="middle" font-size="11.5" fill="#888888">content → evidence →</text>
  <text x="725" y="180" text-anchor="middle" font-size="11.5" fill="#888888">assess</text>
  <text x="725" y="206" text-anchor="middle" font-size="11" fill="#d97757">LLM Gateway · 3-layer</text>
  <text x="725" y="222" text-anchor="middle" font-size="11" fill="#d97757">egress gate · Ollama-ready</text>

  <!-- assets -->
  <line x1="725" y1="248" x2="725" y2="288" stroke="#d97757" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="450" y="292" width="460" height="52" rx="10" fill="none" stroke="#88888899"/>
  <text x="680" y="313" text-anchor="middle" font-size="12.5" font-weight="600" fill="#888888">Knowledge assets</text>
  <text x="680" y="332" text-anchor="middle" font-size="11.5" fill="#888888">weekly reports · tech designs · ADRs · incidents · books · agent skills · knowledge graph</text>

  <!-- review/publish note -->
  <text x="430" y="318" text-anchor="end" font-size="11" fill="#d97757">review · redact · publish →</text>
</svg>
