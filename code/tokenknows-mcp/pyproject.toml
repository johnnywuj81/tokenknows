[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenknows-mcp"
version = "0.3.0"
description = "TokenKnows MCP server — distill AI coding sessions (Claude Code / Codex / Cursor) into weekly reports, ADRs and a knowledge graph on your self-hosted workbench"
readme = "README.md"
license = "MIT"
authors = [{ name = "johnnywuj81" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "claude-code", "knowledge-management", "knowledge-graph", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/johnnywuj81/tokenknows"
Repository = "https://github.com/johnnywuj81/tokenknows"
Issues = "https://github.com/johnnywuj81/tokenknows/issues"

[project.scripts]
tokenknows-mcp = "mcp_server.server:main"
tokenknows-watcher = "mcp_server.daemon:main"

[tool.hatch.build]
artifacts = ["mcp_server"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.hatch.build.targets.sdist]
include = ["mcp_server", "README.md", "pyproject.toml"]
