[project]
name = "tokenknows-api"
version = "0.1.0"
description = "TokenKnows API · FastAPI 后端 + LLM Gateway (三层出域门禁 + LiteLLM 多家适配)"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 配置
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # LLM (统一适配 - 业务代码不允许直接 import anthropic/openai/minimax)
    "litellm>=1.50.0",
    # 异步 HTTP (litellm 内部用)
    "httpx>=0.28.0",
    # 可观测 (复用 digital_enterprise core)
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    # 实用
    "orjson>=3.10.0",
    # F · LLM JSON 输出容错 (MiniMax abab6.5s 等老模型常输出缺逗号 / 未转义引号 / 尾逗号)
    # _parse_llm_json 严格 json.loads 失败后 fallback 到 json-repair, 修复后再 parse
    "json-repair>=0.30.0",
    # v0.3 IM 集成 · OAuth token Fernet 加密 (T16+)
    "cryptography>=44.0.0",
    # v0.4 自动触发 · APScheduler 3.x (T27+); in-process AsyncIO, 无 Celery/Redis 重依赖
    # 决策偏差: Proposal 原写 4.x, 但 v4 仍 alpha (4.0.0a6), 改用稳定 3.10+
    "apscheduler>=3.10.0,<4.0",
    # v0.4 自动触发 · cron 表达式解析 (T29 RuleEvaluator)
    "croniter>=2.0.0",
    # v1.1 · JWT session auth (T74-T76 替换 v0.9 X-User-Id MVP)
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    # 注: bcrypt 5.x 与 passlib 1.7.x 不兼容 (passlib 探测 __about__);
    # pin <4.1 等 passlib 2.x 出来再放开
    "bcrypt>=4.0,<4.1",
    "email-validator>=2.0.0",
    # v1.5 T100 · KG 缩略图 PNG 渲染 (Pillow 纯 Python, 无系统依赖)
    # cairosvg 留 v1.6+ 备选 (需系统 cairo 库)
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # v0.4 T29 测试用 (cron 时间模拟)
    "freezegun>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 架构铁律 (TDD §2.3): 业务代码必须走 LLM Gateway
# 例外: app/llm_gateway/adapters/* 文件内可 import (用 # noqa: TID251)
"anthropic".msg = "Use app.llm_gateway instead — 业务代码禁止直接 import anthropic"
"openai.OpenAI".msg = "Use app.llm_gateway instead"
"openai.AsyncOpenAI".msg = "Use app.llm_gateway instead"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 默认不启 coverage (跑得快, 本地开发友好); CI 显式 --cov 时启
# 公司里如要强制最低覆盖: 在 CI 加 --cov-fail-under=70

[tool.coverage.run]
source = ["app"]
omit = [
    "app/__pycache__/*",
    "app/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 1
