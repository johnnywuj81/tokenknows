# TokenKnows API · 本地 docker compose
#
# 启动:
#   docker compose up -d
#   docker compose logs -f api
# 停:
#   docker compose down
#
# 前置:
#   - host 跑了 Ollama (ollama serve), 端口 11434
#   - 当前目录有 .env.local (3 个 LLM key, 见 .env.local.example)
#
# 中国大陆网络提示: 构建期容器内直连 pypi.org 可能超时. 两种解法任选:
#   docker compose build --build-arg HTTP_PROXY=http://host.docker.internal:<代理端口> \
#                        --build-arg HTTPS_PROXY=http://host.docker.internal:<代理端口>
#   (或) 在 Dockerfile 的 uv pip install 前加 UV_INDEX_URL 指向国内 PyPI 镜像

services:
  api:
    build: .
    image: tokenknows/api:dev
    container_name: tokenknows-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env.local
    environment:
      # 容器内连 host 上的 Ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      EGRESS_LOG_PATH: /app/data/egress.sqlite
    volumes:
      # SQLite 持久化 (state.sqlite + egress.sqlite)
      - ./data:/app/data
    # host 网络模式 Linux 上需要, macOS Docker Desktop 用 host.docker.internal 即可
    # 但若 Linux 客户机要直连 Ollama 11434, 改 network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/v1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# (可选) 未来加 Postgres / Redis 时:
