<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TokenKnows · 发布</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #14141399; color: #141413; font-size: 14px; }
    .font-serif { font-family: 'Lora', Georgia, serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .page-bg { background: rgba(20, 20, 19, 0.45); backdrop-filter: blur(4px); }
  </style>
</head>
<body class="min-h-screen page-bg flex items-center justify-center p-6">

  <!-- 发布对话框 -->
  <div class="bg-[#f5f4ed] border border-[#e8e6dc] rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">

    <!-- 头部 -->
    <div class="p-6 border-b border-[#e8e6dc] flex items-start justify-between">
      <div>
        <h2 class="font-serif text-2xl text-[#141413] leading-tight">发布到外部目的地</h2>
        <p class="text-sm text-[#85857c] mt-1.5">「项目周报 · W22」 · v3 · 由 @alice 审批通过</p>
      </div>
      <button class="text-[#85857c] hover:text-[#141413] p-1.5 transition">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- 内容 -->
    <div class="p-6">

      <!-- 步骤 1：选择目的地 -->
      <div>
        <div class="flex items-center gap-2 mb-3">
          <div class="w-5 h-5 rounded-full bg-[#141413] text-[#faf9f5] text-xs font-medium flex items-center justify-center">1</div>
          <span class="font-medium text-[#141413]">选择发布目的地</span>
          <span class="text-xs text-[#85857c]">可多选</span>
        </div>

        <div class="grid grid-cols-2 gap-2.5">

          <!-- TokenKnows 内部 · 选中 -->
          <label class="bg-[#faf9f5] border-2 border-[#141413] rounded-lg p-3.5 cursor-pointer transition relative">
            <input type="checkbox" checked class="absolute top-3 right-3 w-4 h-4 accent-[#141413]">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-md bg-[#141413] flex items-center justify-center flex-shrink-0">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d97757" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
              </div>
              <div>
                <div class="font-medium text-sm text-[#141413]">TokenKnows 内部</div>
                <div class="text-xs text-[#85857c]">项目知识库</div>
              </div>
            </div>
          </label>

          <!-- 飞书 · 选中 -->
          <label class="bg-[#faf9f5] border-2 border-[#141413] rounded-lg p-3.5 cursor-pointer transition relative">
            <input type="checkbox" checked class="absolute top-3 right-3 w-4 h-4 accent-[#141413]">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-md bg-[#00d6b9]/15 flex items-center justify-center flex-shrink-0">
                <span class="font-bold text-sm text-[#00a087]">飞书</span>
              </div>
              <div>
                <div class="font-medium text-sm text-[#141413]">飞书</div>
                <div class="text-xs text-[#5d6e45] flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[#788c5d]"></span>已配置</div>
              </div>
            </div>
          </label>

          <!-- Slack · 未选 -->
          <label class="bg-[#faf9f5] border-2 border-[#e8e6dc] rounded-lg p-3.5 cursor-pointer hover:border-[#d4d2c7] transition relative">
            <input type="checkbox" class="absolute top-3 right-3 w-4 h-4 accent-[#141413]">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-md bg-[#4a154b]/10 flex items-center justify-center flex-shrink-0">
                <span class="font-bold text-sm text-[#4a154b]">#</span>
              </div>
              <div>
                <div class="font-medium text-sm text-[#141413]">Slack</div>
                <div class="text-xs text-[#5d6e45] flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[#788c5d]"></span>已配置</div>
              </div>
            </div>
          </label>

          <!-- Notion · 未配置 -->
          <label class="bg-[#faf9f5] border-2 border-dashed border-[#d4d2c7] rounded-lg p-3.5 cursor-pointer hover:border-[#d97757] hover:bg-[#fbeae0]/20 transition relative opacity-80">
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-md bg-[#e8e6dc] flex items-center justify-center flex-shrink-0">
                <span class="font-bold text-sm text-[#3a3a37]">N</span>
              </div>
              <div>
                <div class="font-medium text-sm text-[#141413]">Notion</div>
                <div class="text-xs text-[#856226] flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-[#d97757]"></span>需要配置凭证</div>
              </div>
            </div>
          </label>

        </div>
      </div>

      <!-- 步骤 2：发布模式 -->
      <div class="mt-7">
        <div class="flex items-center gap-2 mb-3">
          <div class="w-5 h-5 rounded-full bg-[#141413] text-[#faf9f5] text-xs font-medium flex items-center justify-center">2</div>
          <span class="font-medium text-[#141413]">发布模式</span>
          <span class="text-xs text-[#85857c]">适用于外部目的地</span>
        </div>

        <div class="space-y-2">
          <label class="bg-[#faf9f5] border border-[#141413] rounded-lg p-3.5 cursor-pointer block ring-2 ring-[#fbeae0]/40">
            <div class="flex items-start gap-3">
              <input type="radio" name="mode" checked class="mt-1 accent-[#141413]">
              <div class="flex-1">
                <div class="font-medium text-sm text-[#141413]">完整文档</div>
                <div class="text-xs text-[#5d5d57] mt-1 font-serif leading-relaxed">将整份文档（含证据链脚注）发布到目的地。适合内部分享、归档。</div>
              </div>
            </div>
          </label>
          <label class="bg-[#faf9f5] border border-[#e8e6dc] rounded-lg p-3.5 cursor-pointer hover:border-[#d4d2c7] block transition">
            <div class="flex items-start gap-3">
              <input type="radio" name="mode" class="mt-1 accent-[#141413]">
              <div class="flex-1">
                <div class="font-medium text-sm text-[#141413]">摘要 + 回链 TokenKnows</div>
                <div class="text-xs text-[#5d5d57] mt-1 font-serif leading-relaxed">仅发送 5 行摘要 + 一个回到 TokenKnows 的链接。适合广播、外部传播。</div>
              </div>
            </div>
          </label>
        </div>

        <label class="flex items-center gap-2 mt-3 text-sm text-[#3a3a37] cursor-pointer">
          <input type="checkbox" checked class="w-4 h-4 rounded border-[#d4d2c7] accent-[#d97757]">
          <span>记住选择（下次自动勾选这些目的地与模式）</span>
        </label>
      </div>

      <!-- 数据驻留确认 -->
      <div class="mt-7 bg-[#eef2e3]/40 border border-[#bdc9a3] rounded-lg p-3.5 flex items-start gap-3">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5d6e45" stroke-width="2" class="flex-shrink-0 mt-0.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
        <div class="text-xs leading-relaxed">
          <div class="font-medium text-[#3d4a2c]">已通过脱敏门禁 · 12/12 项已确认</div>
          <div class="text-[#5d5d57] mt-0.5">外部目的地仅收到脱敏后的内容。原文与审计日志保留在你的私有化实例。</div>
        </div>
      </div>

    </div>

    <!-- 底部操作 -->
    <div class="border-t border-[#e8e6dc] px-6 py-4 flex items-center justify-between bg-[#faf9f5]">
      <div class="text-xs text-[#85857c]">将发布到 <span class="font-medium text-[#141413]">2 个目的地</span></div>
      <div class="flex items-center gap-2">
        <button class="px-4 py-2 border border-[#e8e6dc] text-[#3a3a37] text-sm rounded-md hover:bg-[#e8e6dc]/40 transition">取消</button>
        <button class="px-5 py-2 bg-[#141413] text-[#faf9f5] text-sm font-medium rounded-md hover:bg-[#3a3a37] transition flex items-center gap-2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          发布
        </button>
      </div>
    </div>

  </div>

</body>
</html>
