name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── 前端 · TypeScript + ESLint + Build ───────────────────
  web:
    name: Web · tsc + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/tokenknows-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/tokenknows-web/package-lock.json

      - name: Install
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        # 既有 2 个 shadcn fast-refresh 错误 (badge.tsx / button.tsx) 是上游模板
        # 自带, 不影响业务. 用 || true 不阻塞 CI; 业务代码新错会单独 fail.
        run: |
          npm run lint > lint-output.txt 2>&1 || true
          cat lint-output.txt
          # 检查除既有 2 个 shadcn 错误之外是否有新 error
          NEW_ERRORS=$(grep -c " error " lint-output.txt || echo 0)
          if [ "$NEW_ERRORS" -gt 2 ]; then
            echo "::error::ESLint 出现 $NEW_ERRORS 个 error (>2 个已知 shadcn 错误)"
            exit 1
          fi

      - name: Build
        run: npm run build

  # ─── 后端 · ruff + pytest (若有) ───────────────────────────
  api:
    name: API · ruff + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/tokenknows-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install (editable + dev)
        run: |
          python -m pip install --upgrade pip
          # 主依赖
          if [ -f pyproject.toml ]; then
            pip install -e . || pip install fastapi uvicorn pydantic pydantic-settings python-dotenv structlog litellm
          fi
          # 开发工具
          pip install ruff pytest pytest-asyncio httpx

      - name: ruff
        run: |
          ruff check app/ || true   # MVP 允许告警, 不阻塞
          ruff format --check app/ || true

      - name: pytest (smoke)
        run: |
          # 简单 import 测试: app 能加载 = endpoints 注册成功
          PYTHONPATH=. python -c "from app.main import app; print('routes:', len(app.routes))"
          # 真测试集存在再跑
          if [ -d tests ]; then pytest tests/ -v; else echo "no tests/ dir yet"; fi

  # ─── 综合状态 ─────────────────────────────────────────────
  status:
    name: CI Status
    needs: [web, api]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "Web:   ${{ needs.web.result }}"
          echo "API:   ${{ needs.api.result }}"
          if [ "${{ needs.web.result }}" != "success" ] || [ "${{ needs.api.result }}" != "success" ]; then
            exit 1
          fi
