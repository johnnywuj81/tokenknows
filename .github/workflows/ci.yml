name: CI

# GitHub-hosted runners (公开仓库免费) — 任何 fork 的 PR 都能跑.
# 自托管 macOS runner 的对照流水线见 ci-macos.yml (仅维护者 main push, 绝不跑外部 PR 代码).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── 前端 · TypeScript + ESLint + Build + Vitest ──────────
  web:
    name: Web · tsc + lint + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/tokenknows-web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/tokenknows-web/package-lock.json

      - name: Install
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: TypeScript check
        run: npx tsc -b --force   # 根 tsconfig 是 solution-style, --noEmit 是空检查; -b --force 绕过 tsbuildinfo 缓存

      - name: ESLint (strict)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Vitest + coverage
        run: |
          npm test -- --coverage --reporter=default 2>&1 | tee vitest-output.txt
          grep -E "^All files" vitest-output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

  # ─── 后端 · ruff + import smoke + pytest ──────────────────
  api:
    name: API · ruff + import smoke + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/tokenknows-api
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/tokenknows-api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: |
          ruff check app/
          ruff format --check app/ || true   # format 全量重排是大 churn, 暂 info-only

      - name: Import smoke (FastAPI app loads + routes registered)
        run: |
          PYTHONPATH=. python -c "
          from app.main import app
          routes = [r.path for r in app.routes if hasattr(r, 'path')]
          print(f'routes: {len(routes)}')
          for need in ['/api/v1/healthz', '/api/v1/projects/{project_id}/events',
                       '/api/v1/assets/{asset_id}/publish']:
              assert any(need in r for r in routes), f'missing {need}'
          print('all required routes registered ✓')
          "

      - name: pytest + coverage
        run: |
          PYTHONPATH=. pytest tests/ --cov --cov-report=term | tee pytest-output.txt
          grep -E "^TOTAL " pytest-output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

  # ─── 插件层 · 全部 5 个 collector 语法 + VS Code 扩展编译 ──
  plugins:
    name: Plugins · syntax + vscode tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Python syntax check (5 collectors)
        run: |
          for f in plugins/claude-code/sync.py plugins/cursor/sync.py \
                   plugins/github/sync.py plugins/codex/sync.py \
                   plugins/local-docs/sync.py; do
            python3 -m py_compile "$f" && echo "  ✓ $f"
          done

      - name: VS Code 扩展 TS 编译
        working-directory: plugins/vscode-tokenknows
        run: |
          npm ci --prefer-offline --no-audit --progress=false
          npx tsc -p ./

  # ─── 综合状态 (branch protection 唯一 required check) ──────
  status:
    name: CI Status
    needs: [web, api, plugins]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "Web:     ${{ needs.web.result }}"
          echo "API:     ${{ needs.api.result }}"
          echo "Plugins: ${{ needs.plugins.result }}"
          if [ "${{ needs.web.result }}" != "success" ] \
             || [ "${{ needs.api.result }}" != "success" ] \
             || [ "${{ needs.plugins.result }}" != "success" ]; then
            exit 1
          fi
