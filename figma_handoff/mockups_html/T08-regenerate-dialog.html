<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>TokenKnows · 章节重生成</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: rgba(20,20,19,0.45); backdrop-filter: blur(4px); color: #141413; font-size: 14px; }
    .font-serif { font-family: 'Lora', Georgia, serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <div class="bg-[#f5f4ed] border border-[#e8e6dc] rounded-xl shadow-2xl w-full max-w-xl">

    <!-- 头部 -->
    <div class="p-5 border-b border-[#e8e6dc]">
      <div class="flex items-start justify-between">
        <div>
          <h2 class="font-serif text-xl text-[#141413] leading-tight">重生成章节</h2>
          <p class="text-sm text-[#85857c] mt-1">「3. 关键决策」 · 当前 v2</p>
        </div>
        <button class="text-[#85857c] hover:text-[#141413] p-1 transition">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- 内容 -->
    <div class="p-5 space-y-5">

      <!-- 模型选择 -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-xs font-medium text-[#3a3a37] uppercase tracking-wider">使用模型</label>
          <button class="text-xs text-[#d97757] hover:text-[#b8623f] transition">了解模型差异 →</button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <label class="bg-[#faf9f5] border-2 border-[#141413] rounded-md p-3 cursor-pointer ring-2 ring-[#fbeae0]/30">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <input type="radio" name="model" checked class="accent-[#141413]">
                <span class="text-sm font-medium text-[#141413]">Claude Sonnet 4.6</span>
              </div>
              <span class="text-xs text-[#5d6e45] bg-[#eef2e3] px-1.5 py-0.5 rounded">推荐</span>
            </div>
            <div class="text-xs text-[#85857c] mt-1 ml-6">云端 · 当前章节默认</div>
          </label>
          <label class="bg-[#faf9f5] border-2 border-[#e8e6dc] rounded-md p-3 cursor-pointer hover:border-[#d4d2c7] transition">
            <div class="flex items-center gap-2">
              <input type="radio" name="model" class="accent-[#141413]">
              <span class="text-sm font-medium text-[#141413]">GPT-4o</span>
            </div>
            <div class="text-xs text-[#85857c] mt-1 ml-6">云端</div>
          </label>
          <label class="bg-[#faf9f5] border-2 border-[#e8e6dc] rounded-md p-3 cursor-pointer hover:border-[#d4d2c7] transition">
            <div class="flex items-center gap-2">
              <input type="radio" name="model" class="accent-[#141413]">
              <span class="text-sm font-medium text-[#141413]">Qwen 32B (本地)</span>
            </div>
            <div class="text-xs text-[#85857c] mt-1 ml-6">本地 · Ollama</div>
          </label>
          <label class="bg-[#e8e6dc]/40 border-2 border-[#e8e6dc] rounded-md p-3 cursor-not-allowed opacity-60 relative">
            <div class="flex items-center gap-2">
              <input type="radio" name="model" disabled class="accent-[#141413]">
              <span class="text-sm font-medium text-[#85857c]">Llama 70B (本地)</span>
            </div>
            <div class="text-xs text-[#856226] mt-1 ml-6">项目级出域开关已关闭</div>
          </label>
        </div>
      </div>

      <!-- 修改指令 -->
      <div>
        <label class="text-xs font-medium text-[#3a3a37] uppercase tracking-wider block mb-2">修改要求 <span class="text-[#85857c] normal-case font-normal">（可选）</span></label>
        <textarea class="w-full p-3 bg-[#faf9f5] border border-[#e8e6dc] rounded-md text-sm focus:outline-none focus:border-[#d97757] focus:ring-2 focus:ring-[#fbeae0] transition font-serif" rows="3" placeholder="例：再具体一点，加上每个决策的风险点">再详细描述每个决策的"备选方案"部分，加上风险点</textarea>
        <div class="mt-2 flex items-center gap-1.5 flex-wrap">
          <span class="text-xs text-[#85857c]">建议：</span>
          <button class="text-xs px-2 py-1 bg-[#e8e6dc]/50 hover:bg-[#e8e6dc] text-[#3a3a37] rounded transition">更简洁</button>
          <button class="text-xs px-2 py-1 bg-[#e8e6dc]/50 hover:bg-[#e8e6dc] text-[#3a3a37] rounded transition">更具体</button>
          <button class="text-xs px-2 py-1 bg-[#e8e6dc]/50 hover:bg-[#e8e6dc] text-[#3a3a37] rounded transition">加风险点</button>
          <button class="text-xs px-2 py-1 bg-[#e8e6dc]/50 hover:bg-[#e8e6dc] text-[#3a3a37] rounded transition">加备选方案对比</button>
        </div>
      </div>

      <!-- 当前自评分 -->
      <div class="bg-[#faf9f5] border border-[#e8e6dc] rounded-md p-3">
        <div class="text-xs font-medium text-[#85857c] uppercase tracking-wider mb-2">当前章节自评分（参考）</div>
        <div class="grid grid-cols-4 gap-3 text-xs">
          <div>
            <div class="text-[#85857c]">覆盖度</div>
            <div class="font-mono font-bold text-[#5d6e45] text-base">79%</div>
          </div>
          <div>
            <div class="text-[#85857c]">引用密度</div>
            <div class="font-mono font-bold text-[#5d6e45] text-base">高</div>
          </div>
          <div>
            <div class="text-[#85857c]">空话比例</div>
            <div class="font-mono font-bold text-[#856226] text-base">18%</div>
          </div>
          <div>
            <div class="text-[#85857c]">相似度</div>
            <div class="font-mono font-bold text-[#3a3a37] text-base">中</div>
          </div>
        </div>
      </div>

    </div>

    <!-- 底部 -->
    <div class="border-t border-[#e8e6dc] px-5 py-4 flex items-center justify-between bg-[#faf9f5] rounded-b-xl">
      <div class="text-xs text-[#85857c]">重生成将创建新版本（v3），旧版本可在历史中查看</div>
      <div class="flex items-center gap-2">
        <button class="px-3 py-1.5 border border-[#e8e6dc] text-[#3a3a37] text-sm rounded-md hover:bg-[#e8e6dc]/40 transition">取消</button>
        <button class="px-4 py-1.5 bg-[#141413] text-[#faf9f5] text-sm font-medium rounded-md hover:bg-[#3a3a37] transition flex items-center gap-1.5">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          重生成
        </button>
      </div>
    </div>

  </div>

</body>
</html>
